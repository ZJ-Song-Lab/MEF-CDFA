# Parameters
nc: 80 # number of classes
scales:
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024] # YOLO11n + MEF + CDFA
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

#  backbone
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]] # 2

  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8 (80x80, C=64) shallow P3 stream
  - [-1, 1, MutilScaleEdgeInfoGenetator, [3]] # 4-MSEG on the P3 stream, parameter-free, r=1/2/4
  - [4, 1, GetIndexOutput, [0]] # 5 edge r=1 -> aligned with P3/8
  - [4, 1, GetIndexOutput, [1]] # 6 edge r=2 -> aligned with P4/16
  - [4, 1, GetIndexOutput, [2]] # 7 edge r=4 -> aligned with P5/32

  - [3, 2, C3k2, [512, False, 0.25]] # 8
  - [[5, -1], 1, ConvEdgeFusion, [512]] # 9-P3/8 EGFF
  - [-1, 1, Conv, [512, 3, 2]] # 10-P4/16
  - [-1, 2, C3k2, [512, True]] # 11
  - [[6, -1], 1, ConvEdgeFusion, [512]] # 12-P4/16 EGFF
  - [-1, 1, Conv, [1024, 3, 2]] # 13-P5/32
  - [-1, 2, C3k2, [1024, True]] # 14
  - [[7, -1], 1, ConvEdgeFusion, [1024]] # 15-P5/32 EGFF
  - [-1, 1, SPPF, [1024, 5]] # 16
  - [-1, 2, C2PSA, [1024]] # 17

#  head (FPN + PAN); one CDFA block follows each neck output level {P3, P4, P5}
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 18
  - [[-1, 12], 1, Concat, [1]] # 19 cat backbone P4
  - [-1, 2, C3k2, [512, False]] # 20

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 21
  - [[-1, 9], 1, Concat, [1]] # 22 cat backbone P3
  - [-1, 2, C3k2, [256, False]] # 23 (P3/8-small)
  - [[5, -1], 1, ConvEdgeFusion, [512]] # 24-P3/8 EGFF
  - [-1, 1, ContrastDrivenFeatureAggregation, []] # 25 CDFA on neck output P3

  - [-1, 1, Conv, [256, 3, 2]] # 26
  - [[-1, 20], 1, Concat, [1]] # 27 cat head P4
  - [-1, 2, C3k2, [512, False]] # 28 (P4/16-medium)
  - [[6, -1], 1, ConvEdgeFusion, [512]] # 29-P4/16 EGFF
  - [-1, 1, ContrastDrivenFeatureAggregation, []] # 30 CDFA on neck output P4

  - [-1, 1, Conv, [512, 3, 2]] # 31
  - [[-1, 17], 1, Concat, [1]] # 32 cat head P5
  - [-1, 2, C3k2, [1024, True]] # 33 (P5/32-large)
  - [[7, -1], 1, ConvEdgeFusion, [1024]] # 34-P5/32 EGFF
  - [-1, 1, ContrastDrivenFeatureAggregation, []] # 35 CDFA on neck output P5

  - [[25, 30, 35], 1, OBB, [nc, 1]] # 36 Detect(P3, P4, P5)
